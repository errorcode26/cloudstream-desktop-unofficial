name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Run Tests, Build, and Coverage
      env:
        ANILIST_KEY: ${{ secrets.ANILIST_KEY }}
        ANILIST_SECRET: ${{ secrets.ANILIST_SECRET }}
        TMDB_KEY: ${{ secrets.TMDB_KEY }}
        MAL_KEY: ${{ secrets.MAL_KEY }}
        MAL_SECRET: ${{ secrets.MAL_SECRET }}
        SIMKL_KEY: ${{ secrets.SIMKL_KEY }}
      run: ./gradlew :common:test :plugin-runtime:test :player-abstraction:test :desktop-app:test :desktop-app:assemble jacocoTestReport --no-daemon --no-build-cache

    - name: Verify Baked Tracker Config Injection (Masked)
      if: github.event_name == 'push'
      shell: pwsh
      run: |
        $propPath = "desktop-app/build/generated/version-resources/tracker.properties"
        if (-not (Test-Path $propPath)) {
          Write-Error "tracker.properties was not generated at $propPath"
          exit 1
        }
        $configuredCount = 0
        foreach ($line in Get-Content $propPath) {
          if ($line -match '^([^=]+)=(.*)$') {
            $k = $Matches[1].Trim()
            $isSet = -not [string]::IsNullOrWhiteSpace($Matches[2])
            if ($isSet) { $configuredCount++ }
            $status = if ($isSet) { "configured (masked)" } else { "empty" }
            Write-Output "$k : $status"
          }
        }
        if ($configuredCount -eq 0) {
          Write-Error "Zero secrets were injected into tracker.properties on push."
          exit 1
        }

    - name: Upload Test and Coverage Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-and-coverage-reports
        path: |
          common/build/reports/tests/
          common/build/reports/jacoco/
          desktop-app/build/reports/tests/
          desktop-app/build/reports/jacoco/
          plugin-runtime/build/reports/tests/
          plugin-runtime/build/reports/jacoco/
          player-abstraction/build/reports/tests/
          player-abstraction/build/reports/jacoco/
