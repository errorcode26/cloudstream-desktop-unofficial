name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Run Tests, Build, and Coverage
      run: ./gradlew :common:test :plugin-runtime:test :player-abstraction:test :desktop-app:test :desktop-app:assemble jacocoTestReport --no-daemon

    - name: Upload Test and Coverage Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-and-coverage-reports
        path: |
          common/build/reports/tests/
          common/build/reports/jacoco/
          desktop-app/build/reports/tests/
          desktop-app/build/reports/jacoco/
          plugin-runtime/build/reports/tests/
          plugin-runtime/build/reports/jacoco/
          player-abstraction/build/reports/tests/
          player-abstraction/build/reports/jacoco/
